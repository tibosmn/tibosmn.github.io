repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: '^(\.pre-commit-config\.yaml|_config\.yml|index\.html|_layouts/.*\.html|_includes/.*\.html|_data/.*\.yml|assets/(css|js)/.*)$'
      - id: trailing-whitespace
        files: '^(\.pre-commit-config\.yaml|_config\.yml|index\.html|_layouts/.*\.html|_includes/.*\.html|_data/.*\.yml|assets/(css|js)/.*)$'
      - id: check-yaml
        files: '^(\.pre-commit-config\.yaml|_config\.yml)$'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.1.0
          - "@shopify/prettier-plugin-liquid@1.11.0"
        files: '^(\.pre-commit-config\.yaml|_config\.yml|index\.html|_layouts/.*\.html|_data/.*\.yml|assets/(css|js)/.*)$'
