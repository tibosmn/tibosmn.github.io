title: Thibault Simon
description: >-
  Software engineer and PhD in software ecodesign, now CTO of Resilio,
  bridging research-grade life cycle assessment with production-scale tooling.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://thibaultsimon.fr" # the base hostname & protocol for your site, e.g. http://example.com
lang: en
timezone: Europe/Paris

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - vendor/
  - node_modules/
  - README.md
  - Gemfile
  - Gemfile.lock
  - .github/
