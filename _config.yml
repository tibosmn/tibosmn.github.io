title: Thibault Simon
description: >-
  I am a PhD candidate working on software environmental footprint in the Spirals team at Inria Lille and Orange Innovation in Rennes.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://thibaultsimon.fr" # the base hostname & protocol for your site, e.g. http://example.com
lang: en
timezone: Europe/Paris

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - vendor/
  - node_modules/
  - README.md
  - Gemfile
  - Gemfile.lock
  - .github/
